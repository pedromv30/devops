<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Acadêmico DevOps</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo">
<h1>Portal Acadêmico DevOps</h1>
<button id="botaoDestaque">Ver serviços</button>
<nav class="navegacao">
<ul>
<li><a href="#servicos">Serviços</a></li>
<li><a href="#contato">Contato</a></li>
</ul>
</nav>
</header>
<main>
<section id="servicos" class="secao">
<h2>Serviços disponíveis</h2>
<div class="cards">
<article class="card">
<h3>Matrícula</h3>
<p>Orientações sobre matrícula e documentação.</p>
</article>
<article class="card">
<h3>Calendário</h3>
<p>Datas importantes do período letivo.</p>
</article>
<article class="card">
<h3>Atendimento</h3>
<p>Canal para dúvidas e solicitações.</p>
</article> 
</div>
</section>
<section class="secao">
<h2>Contato</h2>
<form id="formContato">
<label for="nome">Nome</label>
<input id="nome" type="text" placeholder="Digite seu nome">
<label for="mensagem">Mensagem</label>
<textarea id="mensagem" placeholder="Digite sua solicitação"></textarea>
<button type="submit">Enviar</button>
</form>
<p id="resposta"></p>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
